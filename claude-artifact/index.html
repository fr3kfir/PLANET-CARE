<title>צמחייה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;900&family=Assistant:wght@400;600;700;800&display=swap">
<style>
/* Layout: one phone-width column, herbarium-label cards, bottom tab bar. */
:root {
  --bg: #eef3ec;
  --surface: #ffffff;
  --sunken: #e3ebe0;
  --fg: #1d2a20;
  --muted: #5d6e61;
  --line: #cfdccb;
  --leaf: #2f6b43;
  --leaf-ink: #ffffff;
  --leaf-soft: #dcebdf;
  --water: #1f6f9c;
  --water-soft: #dbeaf3;
  --ok: #2e7d4f; --ok-soft: #dff0e5;
  --warn: #a8660b; --warn-soft: #fbecd2;
  --bad: #b3372f; --bad-soft: #f8dedb;
  --display: "Frank Ruhl Libre", "David", Georgia, serif;
  --body: "Assistant", "Arial Hebrew", system-ui, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111813; --surface: #19221c; --sunken: #212c24; --fg: #e4ede5; --muted: #9db0a1; --line: #2e3c32;
    --leaf: #74c08c; --leaf-ink: #0e1a12; --leaf-soft: #20382a; --water: #72b7e0; --water-soft: #1b3140;
    --ok: #74c08c; --ok-soft: #1f3527; --warn: #e5a54a; --warn-soft: #3a2c16; --bad: #ec877e; --bad-soft: #3d2220;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111813; --surface: #19221c; --sunken: #212c24; --fg: #e4ede5; --muted: #9db0a1; --line: #2e3c32;
  --leaf: #74c08c; --leaf-ink: #0e1a12; --leaf-soft: #20382a; --water: #72b7e0; --water-soft: #1b3140;
  --ok: #74c08c; --ok-soft: #1f3527; --warn: #e5a54a; --warn-soft: #3a2c16; --bad: #ec877e; --bad-soft: #3d2220;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.55; }
.app { max-width: 560px; margin: 0 auto; padding: 0 16px 112px; display: flex; flex-direction: column; gap: 16px; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--display); font-weight: 900; font-size: 28px; line-height: 1; color: var(--leaf); }
.tagline { color: var(--muted); font-size: 13px; }
h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
h2 { font-size: 26px; line-height: 1.15; }
h3 { font-size: 19px; }
p { margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.label { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.latin { font-family: var(--display); font-style: italic; direction: ltr; unicode-bidi: isolate; }
button, .btn { font: inherit; cursor: pointer; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 12px 16px; font-weight: 800; border: 1px solid transparent; background: var(--leaf); color: var(--leaf-ink); min-height: 48px; }
.btn.ghost { background: var(--surface); color: var(--leaf); border-color: var(--line); }
.btn.water { background: var(--water); color: var(--leaf-ink); }
.btn.danger { background: var(--bad); color: var(--leaf-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, label.pick:focus-within { outline: 3px solid var(--leaf); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
textarea, input[type=text], input[type=number], select { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
label.pick { position: relative; overflow: hidden; }
label.pick input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; background: var(--sunken); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: transparent; color: var(--muted); padding: 10px 4px; border-radius: 9px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--leaf); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.photo { width: 100%; max-height: 340px; object-fit: cover; border-radius: 12px; background: var(--sunken); display: block; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st-healthy { background: var(--ok-soft); color: var(--ok); }
.st-needs_attention { background: var(--warn-soft); color: var(--warn); }
.st-critical { background: var(--bad-soft); color: var(--bad); }
.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--sunken); color: var(--muted); }
.meter { height: 8px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.meter > i { display: block; height: 100%; border-radius: 99px; }
.score { font-family: var(--display); font-weight: 900; font-size: 34px; line-height: 1; font-variant-numeric: tabular-nums; }
.issue { border-inline-start: 5px solid var(--warn); }
.issue.sev-high { border-inline-start-color: var(--bad); }
.issue.sev-low { border-inline-start-color: var(--water); }
.steps { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 6px; }
.fix { background: var(--leaf-soft); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
dl.care { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 10px 14px; }
dl.care dt { font-weight: 800; color: var(--leaf); font-size: 14px; }
dl.care dd { margin: 0; min-width: 0; }
.specimen { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
.stat b { display: block; font-family: var(--display); font-size: 26px; font-variant-numeric: tabular-nums; }
.plant { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-align: start; padding: 0; color: inherit; display: flex; flex-direction: column; }
.plant img { width: 100%; aspect-ratio: 1; object-fit: cover; background: var(--sunken); max-width: 100%; }
.plant .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.plant .name { font-family: var(--display); font-weight: 700; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.due { font-size: 13px; font-weight: 700; color: var(--water); }
.due.later { color: var(--muted); font-weight: 600; }
.history { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.history button { flex: 0 0 92px; border: 2px solid transparent; border-radius: 12px; padding: 0; background: var(--sunken); color: inherit; overflow: hidden; display: flex; flex-direction: column; align-items: center; gap: 4px; padding-bottom: 6px; font-size: 12px; }
.history button[aria-current="true"] { border-color: var(--leaf); }
.history img { width: 100%; height: 72px; object-fit: cover; }
.notice { border-radius: 12px; padding: 12px 14px; font-size: 14px; }
.notice.err { background: var(--bad-soft); color: var(--bad); }
.notice.info { background: var(--leaf-soft); color: var(--leaf); }
.example-tag { align-self: flex-start; background: var(--warn-soft); color: var(--warn); font-weight: 800; font-size: 12px; padding: 3px 10px; border-radius: 6px; }
.spinner { width: 18px; height: 18px; border-radius: 50%; border: 3px solid currentColor; border-top-color: transparent; animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
nav.tabs { position: fixed; inset-inline: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; }
nav.tabs button { border: 0; background: transparent; color: var(--muted); padding: 14px 8px; font-weight: 800; font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.tabs button[aria-current="true"] { color: var(--leaf); box-shadow: inset 0 3px 0 var(--leaf); }
nav.tabs svg { width: 24px; height: 24px; }
.back { align-self: flex-start; border: 0; background: none; color: var(--leaf); font-weight: 800; padding: 4px 0; }
.textlink { border: 0; background: none; color: var(--bad); font-weight: 700; padding: 8px; align-self: center; }
</style>

<div class="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand">צמחייה</div>
    <div class="tagline">מזהים, מאבחנים ומגדלים נכון</div>
  </header>
  <main id="main" style="display:flex;flex-direction:column;gap:16px"></main>
</div>
<nav class="tabs" dir="rtl" aria-label="ניווט">
  <div class="in">
    <button id="tab-scan" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      סריקה
    </button>
    <button id="tab-plants" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 14h12l-1.5 7h-9z"/><path d="M12 14V8"/><path d="M12 9c0-3 2-5 6-5 0 4-2 6-6 5z"/><path d="M12 11c0-2.5-2-4-5-4 0 3 2 4.5 5 4z"/></svg>
      <span id="plants-tab-label">הצמחים שלי</span>
    </button>
  </div>
</nav>

<script>
(() => {
  const DAY = 86400000;
  const LOCATIONS = { indoor: 'בבית', balcony: 'מרפסת', garden: 'גינה' };
  const STATUS = { healthy: 'בריא', needs_attention: 'דורש תשומת לב', critical: 'מצב קריטי' };
  const SEVERITY = { low: 'קל', medium: 'בינוני', high: 'חמור' };
  const CONFIDENCE = { high: 'זיהוי ודאי', medium: 'זיהוי סביר', low: 'זיהוי לא ודאי' };
  const CATEGORY = {
    light_low: 'חוסר אור', light_high: 'עודף שמש', overwatering: 'השקיית יתר', underwatering: 'חוסר מים',
    soil_drainage: 'אדמה וניקוז', pests: 'מזיקים וכנימות', disease: 'מחלה', nutrients: 'מחסור בדשן',
    temperature: 'טמפרטורה', humidity: 'לחות', pot_roots: 'עציץ ושורשים', other: 'אחר',
  };
  const CARE = [
    ['light', 'אור'], ['water', 'השקיה'], ['soil', 'אדמה'], ['humidity', 'לחות'], ['temperature', 'טמפרטורה'],
    ['fertilizer', 'דישון'], ['repotting', 'העברת עציץ'], ['best_location', 'מיקום'], ['pet_toxicity', 'חיות מחמד'],
  ];

  const EXAMPLE = {
    is_plant: true,
    identification: { common_name_he: 'פיקוס כינורי', common_name_en: 'Fiddle-leaf fig', scientific_name: 'Ficus lyrata', family: 'Moraceae', confidence: 'high', alternatives: [], description: 'עץ נוי לבית עם עלים גדולים ומבריקים בצורת כינור. אוהב יציבות ולא אוהב שמזיזים אותו.' },
    health: { status: 'needs_attention', score: 62, summary: 'הצמח חזק באופן כללי, אבל יש סימנים של השקיית יתר בעלים התחתונים ונגיעות קלה של כנימה קמחית.' },
    issues: [
      { category: 'overwatering', title: 'השקיית יתר', severity: 'medium', evidence: 'כתמים חומים כהים בשולי העלים התחתונים, ואדמה שנראית רטובה.', treatment: ['לא להשקות עד שהאדמה יבשה לעומק 5 ס"מ (בודקים עם האצבע).', 'לוודא שיש חור ניקוז ושהמים לא עומדים בתחתית.', 'להסיר עלים שהשחירו לגמרי.'] },
      { category: 'pests', title: 'כנימה קמחית', severity: 'high', evidence: 'גושים לבנים דמויי צמר בחיבורי העלים לגבעול.', treatment: ['לנגב כל גוש עם מקל אוזניים טבול באלכוהול 70%.', 'לרסס בסבון אשלגן (2%) פעם בשבוע, שלוש פעמים.', 'להרחיק מצמחים אחרים עד שהנגיעות נעלמת.'] },
    ],
    care: { light: 'אור בהיר ועקיף, עד שעתיים של שמש בוקר.', water: 'כשהשכבה העליונה יבשה, השקיה עמוקה עד שהמים יוצאים מלמטה.', water_every_days: 8, soil: 'מצע לעציצים עם פרליט, מנוקז היטב.', humidity: '40–60%. לא ליד מזגן.', temperature: '18–28°C', fertilizer: 'דשן נוזלי מאוזן פעם בחודש, מרץ עד אוקטובר.', repotting: 'כל שנתיים באביב, עציץ גדול ב-5 ס"מ.', best_location: 'מטר–שניים מחלון מזרחי.', pet_toxicity: 'רעיל לחתולים ולכלבים.' },
    tips: ['לסובב את העציץ רבע סיבוב פעם בשבוע כדי שיגדל ישר.', 'לנגב אבק מהעלים עם מטלית לחה פעם בחודש.'],
    photo_quality_note: '',
  };

  const state = {
    view: 'scan', openId: null, plants: [], storage: 'local', storeError: '',
    scan: freshScan(null), sampleOk: null, imagesOk: false,
    renaming: false, confirmDelete: false, histIdx: 0,
  };
  let sample = null, col = null, ctl = null;

  function freshScan(targetId) {
    return { targetId, blob: null, preview: '', location: 'indoor', notes: '', loading: false, error: '', result: null, saving: false };
  }

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtDate = d => new Date(d).toLocaleDateString('he-IL', { day: 'numeric', month: 'short', year: 'numeric' });
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const $ = id => document.getElementById(id);

  // ---------- storage: private per-viewer db, else this browser ----------
  const LS_KEY = 'tzimchiya:plants:v1';
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; } }
  function lsSave() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.plants)); } catch { state.storeError = 'לא ניתן לשמור בדפדפן הזה.'; } }

  async function putPlant(plant) {
    const i = state.plants.findIndex(p => p.id === plant.id);
    if (i >= 0) state.plants[i] = plant; else state.plants.unshift(plant);
    render();
    if (col) {
      const { id, ...body } = plant;
      try { await col.doc(id).set(body); state.storeError = ''; }
      catch (e) { state.storeError = e?.code === 'quota_exceeded' ? 'האחסון מלא. מחקו צמחים או סריקות ישנות.' : 'השמירה נכשלה. נסו שוב.'; render(); }
    } else lsSave();
  }
  async function removePlant(id) {
    state.plants = state.plants.filter(p => p.id !== id);
    render();
    if (col) { try { await col.doc(id).delete(); } catch { state.storeError = 'המחיקה נכשלה.'; render(); } }
    else lsSave();
  }

  async function boot() {
    state.plants = lsLoad();
    state.view = state.plants.length ? 'plants' : 'scan';
    render();
    const c = window.claude;
    if (!c?.use) { state.sampleOk = false; render(); return; }
    const [s, db, user] = await Promise.all([c.use('sample'), c.use('db'), c.use('user')]);
    sample = s;
    state.sampleOk = !!s;
    if (s) { try { state.imagesOk = !!(await s.limits())?.images; } catch { state.imagesOk = false; } }
    const uid = user ? await user.id() : null;
    if (db && uid) {
      col = db.collection('data/users/' + uid);
      state.storage = 'db';
      let first = true;
      col.onSnapshot(snap => {
        state.plants = snap.docs.map(d => ({ id: d.id, ...d.data() }))
          .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
        if (first) { first = false; if (state.plants.length && !state.scan.preview) state.view = state.view === 'scan' && !state.openId ? 'plants' : state.view; }
        render();
      }, () => { state.storeError = 'החיבור לאחסון נותק. רעננו את הדף.'; render(); });
    }
    render();
  }

  // ---------- images ----------
  async function toJpeg(file, maxSide, quality) {
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    const k = Math.min(1, maxSide / Math.max(bmp.width, bmp.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
    cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
    bmp.close?.();
    const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', quality));
    return { blob, dataUrl: cv.toDataURL('image/jpeg', quality) };
  }
  async function thumb(dataUrl) {
    const img = new Image(); img.src = dataUrl; await img.decode();
    const k = Math.min(1, 300 / Math.max(img.width, img.height));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL('image/jpeg', 0.72);
  }

  // ---------- diagnosis ----------
  function buildPrompt(scan, target) {
    const month = new Date().toLocaleString('en-US', { month: 'long' });
    const known = target?.scans?.[0]?.result?.identification?.scientific_name;
    return `You are an experienced horticulturist and plant pathologist helping a home gardener in Israel (houseplants, balcony, garden, herbs, vegetables, fruit trees).

The attached photo shows the grower's plant. Identify the species and assess its health. Look carefully at leaf color and texture, spots, edges, curling, wilting, stems, new growth, the soil surface, the pot and drainage, and signs of pests (aphids, mealybugs, spider mites, scale, whitefly, thrips, fungus gnats) or disease (fungal, bacterial, root rot, powdery mildew).

Context:
- Current month: ${month}
- Where it grows: ${LOCATIONS[scan.location]} (${scan.location})
${known ? `- Previously identified as: ${known}\n` : ''}${scan.notes ? `- Grower's notes: ${scan.notes.slice(0, 800)}\n` : ''}
Rules:
- Write every human-readable value in Hebrew (scientific_name in Latin, common_name_en in English).
- Report only issues with visible evidence in the photo or described in the notes. A healthy plant gets an empty issues array; do not invent problems.
- Treatment steps must be practical and specific for a home grower (amounts, frequency, what to buy), gentle/organic options first.
- Care guidance must fit the Israeli climate, the current season and the location given.
- If unsure of the species, lower confidence and list alternatives.
- If the photo is not a plant, set is_plant to false and fill other fields with short placeholders.

Reply with ONLY one JSON object of exactly this shape:
{
  "is_plant": boolean,
  "identification": {"common_name_he": string, "common_name_en": string, "scientific_name": string, "family": string, "confidence": "high"|"medium"|"low", "alternatives": [string], "description": string (1-2 sentences)},
  "health": {"status": "healthy"|"needs_attention"|"critical", "score": integer 0-100, "summary": string},
  "issues": [{"category": "light_low"|"light_high"|"overwatering"|"underwatering"|"soil_drainage"|"pests"|"disease"|"nutrients"|"temperature"|"humidity"|"pot_roots"|"other", "title": string, "severity": "low"|"medium"|"high", "evidence": string, "treatment": [string]}],
  "care": {"light": string, "water": string, "water_every_days": integer (typical days between waterings now), "soil": string, "humidity": string, "temperature": string, "fertilizer": string, "repotting": string, "best_location": string, "pet_toxicity": string},
  "tips": [string],
  "photo_quality_note": string ("" or advice for a better photo)
}`;
  }

  function normalize(r) {
    if (!r || typeof r !== 'object') throw { code: 'invalid_json' };
    r.identification ||= {}; r.health ||= {}; r.care ||= {};
    r.issues = Array.isArray(r.issues) ? r.issues : [];
    r.tips = Array.isArray(r.tips) ? r.tips : [];
    r.issues.forEach(i => { i.treatment = Array.isArray(i.treatment) ? i.treatment : []; });
    r.health.score = Math.max(0, Math.min(100, Number(r.health.score) || 0));
    r.care.water_every_days = Math.max(0, Math.round(Number(r.care.water_every_days) || 0));
    r.is_plant = r.is_plant !== false;
    return r;
  }

  const ERR = {
    not_granted: 'לא אושר שימוש ב-Claude בדף הזה. אפשר לאשר בפעם הבאה שתפתחו אותו.',
    sampling_disabled: 'Claude לא זמין בחשבון הזה.',
    images_unavailable: 'בתצוגה הזו אי אפשר לשלוח תמונות ל-Claude.',
    rate_limited: 'יותר מדי בקשות כרגע, או שנגמרה מכסת השימוש. נסו שוב בעוד כמה דקות.',
    session_expired: 'צריך להתחבר מחדש ל-claude.ai.',
    image_rejected: 'התמונה לא התקבלה. נסו תמונת JPG או PNG אחרת.',
    refused: 'הבקשה נדחתה. נסו תמונה אחרת של הצמח.',
    invalid_json: 'התשובה הגיעה בפורמט לא תקין. לחצו שוב על "זהה ואבחן".',
  };

  async function analyze() {
    const s = state.scan;
    if (!sample || !s.blob) return;
    ctl = new AbortController();
    s.loading = true; s.error = ''; render();
    try {
      const target = state.plants.find(p => p.id === s.targetId);
      const r = await sample.json(buildPrompt(s, target), { images: [s.blob], signal: ctl.signal, cache: false });
      s.result = normalize(r);
    } catch (e) {
      if (e?.code !== 'cancelled') s.error = ERR[e?.code] || 'משהו השתבש בניתוח. נסו שוב.';
    } finally {
      s.loading = false; render();
    }
  }

  async function saveScan() {
    const s = state.scan;
    s.saving = true; render();
    const scan = { id: newId(), date: new Date().toISOString(), thumb: await thumb(s.preview), notes: s.notes, result: s.result };
    const target = state.plants.find(p => p.id === s.targetId);
    let plant;
    if (target) {
      plant = { ...target, scans: [scan, ...(target.scans || [])].slice(0, 5) };
    } else {
      plant = {
        id: newId(), name: s.result.identification.common_name_he || 'צמח חדש', location: s.location,
        createdAt: scan.date, lastWatered: null, waterEveryDays: s.result.care.water_every_days || null, scans: [scan],
      };
    }
    state.scan = freshScan(null);
    state.view = 'plants'; state.openId = plant.id; state.histIdx = 0;
    await putPlant(plant);
  }

  function watering(p) {
    const every = p.waterEveryDays;
    if (!every) return null;
    if (!p.lastWatered) return { every, due: 0, next: null };
    const next = new Date(p.lastWatered).getTime() + every * DAY;
    return { every, due: Math.ceil((next - Date.now()) / DAY), next };
  }
  function dueHtml(p) {
    const w = watering(p);
    if (!w) return '';
    if (w.due <= 0) return `<span class="due">להשקות היום</span>`;
    if (w.due === 1) return `<span class="due">השקיה מחר</span>`;
    return `<span class="due later">השקיה בעוד ${w.due} ימים</span>`;
  }
  const pill = st => `<span class="pill st-${esc(st)}"><span class="dot"></span>${esc(STATUS[st] || STATUS.needs_attention)}</span>`;

  // ---------- views ----------
  function resultHtml(r) {
    if (!r.is_plant) {
      return `<div class="card"><h3>לא זיהינו צמח בתמונה</h3><p class="muted">${esc(r.photo_quality_note || 'צלמו שוב כשהצמח במרכז הפריים ובאור יום.')}</p></div>`;
    }
    const id = r.identification, h = r.health;
    const color = h.score >= 75 ? 'var(--ok)' : h.score >= 45 ? 'var(--warn)' : 'var(--bad)';
    return `
      <section class="card">
        <div class="specimen">
          <h2>${esc(id.common_name_he)}</h2>
          <span class="chip">${esc(CONFIDENCE[id.confidence] || '')}</span>
          <div class="latin">${esc(id.scientific_name)}</div><span></span>
          <div class="small muted">${esc(id.common_name_en)} · משפחה: <span class="latin">${esc(id.family)}</span></div>
        </div>
        <p>${esc(id.description)}</p>
        ${id.confidence !== 'high' && id.alternatives?.length ? `<p class="small muted">ייתכן גם: ${id.alternatives.map(esc).join(' · ')}</p>` : ''}
      </section>
      <section class="card">
        <div class="row" style="align-items:center">
          <h3>מצב הצמח</h3>
          <div style="display:flex;justify-content:flex-end">${pill(h.status)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="score" style="color:${color}">${h.score}</span>
          <div class="meter" style="flex:1"><i style="width:${Math.max(3, h.score)}%;background:${color}"></i></div>
        </div>
        <p>${esc(h.summary)}</p>
        ${r.photo_quality_note ? `<p class="small muted">לצילום הבא: ${esc(r.photo_quality_note)}</p>` : ''}
      </section>
      ${r.issues.length ? `<h3 style="padding-inline:4px">בעיות שזוהו (${r.issues.length})</h3>` + r.issues.map(i => `
        <section class="card issue sev-${esc(i.severity)}">
          <div class="row" style="align-items:center;gap:8px">
            <strong style="flex:1 1 auto;font-size:18px">${esc(i.title)}</strong>
            <span style="flex:0 0 auto;display:flex;gap:6px"><span class="chip">${esc(CATEGORY[i.category] || 'אחר')}</span><span class="chip">${esc(SEVERITY[i.severity] || '')}</span></span>
          </div>
          <p class="small"><span class="label">מה רואים: </span>${esc(i.evidence)}</p>
          <div class="fix"><span class="label" style="color:var(--leaf)">מה לעשות</span>
            <ol class="steps">${i.treatment.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
          </div>
        </section>`).join('') : `<div class="notice info">לא נמצאו בעיות שנראות בתמונה. המשיכו לטפל כמו עכשיו.</div>`}
      <section class="card">
        <h3>מדריך גידול</h3>
        <dl class="care">${CARE.filter(([k]) => r.care[k]).map(([k, l]) => `<dt>${l}</dt><dd>${esc(r.care[k])}</dd>`).join('')}</dl>
      </section>
      ${r.tips.length ? `<section class="card"><h3>טיפים</h3><ul class="steps">${r.tips.map(t => `<li>${esc(t)}</li>`).join('')}</ul></section>` : ''}`;
  }

  function scanView() {
    const s = state.scan;
    const target = state.plants.find(p => p.id === s.targetId);
    const unavailable = state.sampleOk === false || (state.sampleOk && !state.imagesOk);
    let html = '';
    if (target) html += `<div class="notice info">סריקת מעקב עבור <b>${esc(target.name)}</b>. התוצאה תישמר בהיסטוריה שלו.</div>`;
    if (unavailable) html += `<div class="notice err">הזיהוי עובד כשפותחים את הדף ב-claude.ai (בדפדפן או באפליקציה) כשאתם מחוברים לחשבון.</div>`;
    if (state.sampleOk === null) html += `<div class="notice info">מתחבר ל-Claude...</div>`;

    if (!s.preview) {
      html += `
        <section class="card">
          <h2>צלמו את הצמח</h2>
          <p class="muted">נזהה את הזן, נבדוק מה מצבו ונגיד לכם מה לעשות: אור, מים, אדמה, מזיקים ועוד.</p>
          <div class="row">
            <label class="btn pick">צילום<input id="cam" type="file" accept="image/*" capture="environment"></label>
            <label class="btn ghost pick">בחירה מהגלריה<input id="gal" type="file" accept="image/*"></label>
          </div>
          <ul class="steps small muted">
            <li>צלמו באור יום, בלי פלאש.</li>
            <li>שהצמח כולו ייכנס לפריים. אם יש עלה פגוע, סריקה נוספת שלו מקרוב.</li>
            <li>חושדים במזיקים? צלמו גם את הצד התחתון של העלים.</li>
          </ul>
        </section>
        <span class="example-tag">דוגמה לתוצאה (לא הצמח שלכם)</span>
        ${resultHtml(EXAMPLE)}`;
      return html;
    }

    html += `<img class="photo" src="${s.preview}" alt="הצמח שצולם">`;
    if (!s.result) {
      html += `
        <section class="card">
          <div class="label">איפה הצמח גדל?</div>
          <div class="seg" role="group">${Object.entries(LOCATIONS).map(([k, l]) => `<button type="button" data-loc="${k}" aria-pressed="${s.location === k}">${l}</button>`).join('')}</div>
          <label class="label" for="notes">משהו שכדאי שנדע? (לא חובה)</label>
          <textarea id="notes" rows="2" placeholder="למשל: העלים מצהיבים מלמטה, משקה פעם בשבוע, עומד ליד חלון מערבי">${esc(s.notes)}</textarea>
          ${s.error ? `<div class="notice err">${esc(s.error)}</div>` : ''}
          <div class="row">
            ${s.loading
              ? `<button class="btn" type="button" disabled><span class="spinner"></span>מנתח...</button><button id="stop" class="btn ghost" type="button">עצור</button>`
              : `<button id="go" class="btn" type="button" ${sample && state.imagesOk ? '' : 'disabled'}>זהה ואבחן</button><button id="reset" class="btn ghost" type="button">תמונה אחרת</button>`}
          </div>
          ${s.loading ? `<p class="small muted">הניתוח לוקח בדרך כלל חצי דקה עד דקה.</p>` : ''}
        </section>`;
      return html;
    }
    html += resultHtml(s.result);
    html += `<div class="row" style="position:sticky;bottom:calc(84px + env(safe-area-inset-bottom, 0px))">
      ${s.result.is_plant ? `<button id="save" class="btn" type="button" ${s.saving ? 'disabled' : ''}>${target ? 'שמירה בהיסטוריה' : 'הוספה לצמחים שלי'}</button>` : ''}
      <button id="reset" class="btn ghost" type="button">סריקה חדשה</button></div>`;
    return html;
  }

  function listView() {
    const ps = state.plants;
    if (!ps.length) {
      return `<section class="card" style="text-align:center;align-items:center">
        <h2>האוסף ריק</h2>
        <p class="muted">סרקו צמח ושמרו אותו כאן. תקבלו תזכורת השקיה ותוכלו לעקוב אחרי הבריאות שלו לאורך זמן.</p>
        <button id="to-scan" class="btn" type="button">לסריקה ראשונה</button></section>`;
    }
    const thirsty = ps.filter(p => (watering(p)?.due ?? 1) <= 0).length;
    const sick = ps.filter(p => p.scans?.[0]?.result?.health?.status && p.scans[0].result.health.status !== 'healthy').length;
    return `
      <div class="stats">
        <div class="stat"><b>${ps.length}</b><span class="small muted">צמחים</span></div>
        <div class="stat"><b style="color:var(--water)">${thirsty}</b><span class="small muted">להשקות היום</span></div>
        <div class="stat"><b style="color:var(--warn)">${sick}</b><span class="small muted">דורשים טיפול</span></div>
      </div>
      <div class="grid2">${ps.map(p => {
        const last = p.scans?.[0];
        return `<button class="plant" type="button" data-open="${esc(p.id)}">
          <img src="${last?.thumb || ''}" alt="">
          <div class="body">
            <div class="name">${esc(p.name)}</div>
            <span class="small muted">${esc(LOCATIONS[p.location] || '')}</span>
            ${last?.result?.health ? `<div>${pill(last.result.health.status)}</div>` : ''}
            ${dueHtml(p)}
          </div></button>`;
      }).join('')}</div>
      ${state.storage === 'local' ? `<p class="small muted">הצמחים נשמרים בדפדפן הזה בלבד.</p>` : ''}`;
  }

  function detailView(p) {
    const w = watering(p);
    const scans = p.scans || [];
    const scan = scans[state.histIdx] || scans[0];
    return `
      <button id="back" class="back" type="button">→ חזרה לצמחים שלי</button>
      <section class="card">
        <div style="display:flex;gap:12px;align-items:center">
          <img src="${scans[0]?.thumb || ''}" alt="" style="width:84px;height:84px;border-radius:12px;object-fit:cover;flex:0 0 auto">
          <div style="min-width:0;flex:1;display:flex;flex-direction:column;gap:4px">
            ${state.renaming
              ? `<div class="row"><input id="rename-input" type="text" value="${esc(p.name)}"><button id="rename-save" class="btn" type="button" style="flex:0 0 auto">שמירה</button></div>`
              : `<h2 style="overflow-wrap:anywhere">${esc(p.name)}</h2>`}
            <div class="latin small muted">${esc(scans[0]?.result?.identification?.scientific_name || '')}</div>
            <div class="row" style="gap:8px;align-items:center">
              <select id="loc" style="flex:0 1 auto;width:auto;padding:6px 10px">${Object.entries(LOCATIONS).map(([k, l]) => `<option value="${k}" ${p.location === k ? 'selected' : ''}>${l}</option>`).join('')}</select>
              ${state.renaming ? '' : `<button id="rename" class="back" type="button" style="flex:0 0 auto">שינוי שם</button>`}
            </div>
          </div>
        </div>
      </section>
      <section class="card" style="background:var(--water-soft);border-color:transparent">
        <div class="row" style="align-items:center"><h3>השקיה</h3><div style="display:flex;justify-content:flex-end">${dueHtml(p)}</div></div>
        <p class="small">השקיה אחרונה: ${p.lastWatered ? fmtDate(p.lastWatered) : 'עוד לא נרשמה'}${w?.next ? ` · הבאה: ${fmtDate(w.next)}` : ''}</p>
        <div style="display:flex;align-items:center;gap:8px" class="small">
          <label for="every">להשקות כל</label>
          <input id="every" type="number" min="1" max="60" value="${esc(p.waterEveryDays || '')}" style="width:72px;text-align:center">
          <span>ימים</span>
        </div>
        <button id="watered" class="btn water" type="button">השקיתי עכשיו</button>
      </section>
      <button id="rescan" class="btn ghost" type="button">סריקת מעקב: איך הצמח עכשיו?</button>
      ${scans.length > 1 ? `<section class="card"><h3>היסטוריית סריקות</h3><div class="history">${scans.map((s, i) => `
        <button type="button" data-hist="${i}" aria-current="${i === state.histIdx}"><img src="${s.thumb}" alt=""><span>${fmtDate(s.date)}</span>${pill(s.result?.health?.status)}</button>`).join('')}</div></section>` : ''}
      ${scan ? `<p class="small muted" style="padding-inline:4px">אבחון מ-${fmtDate(scan.date)}${scan.notes ? ` · הערות: ${esc(scan.notes)}` : ''}</p>${resultHtml(scan.result)}` : ''}
      ${state.confirmDelete
        ? `<section class="card"><p>למחוק את "${esc(p.name)}" וכל הסריקות שלו?</p><div class="row"><button id="del-yes" class="btn danger" type="button">מחיקה</button><button id="del-no" class="btn ghost" type="button">ביטול</button></div></section>`
        : `<button id="del" class="textlink" type="button">מחיקת הצמח</button>`}`;
  }

  function render() {
    const main = $('main');
    const open = state.plants.find(p => p.id === state.openId);
    let html = state.storeError ? `<div class="notice err">${esc(state.storeError)}</div>` : '';
    if (state.view === 'scan') html += scanView();
    else if (open) html += detailView(open);
    else html += listView();
    main.innerHTML = html;
    $('tab-scan').setAttribute('aria-current', state.view === 'scan');
    $('tab-plants').setAttribute('aria-current', state.view === 'plants');
    $('plants-tab-label').textContent = 'הצמחים שלי' + (state.plants.length ? ` (${state.plants.length})` : '');
  }

  function go(view) {
    ctl?.abort();
    state.view = view; state.openId = null; state.renaming = false; state.confirmDelete = false;
    if (view === 'scan') state.scan = freshScan(null);
    render(); scrollTo(0, 0);
  }

  // ---------- events (delegated) ----------
  $('tab-scan').onclick = () => go('scan');
  $('tab-plants').onclick = () => go('plants');

  document.addEventListener('change', async e => {
    const t = e.target;
    if (t.id === 'cam' || t.id === 'gal') {
      const f = t.files?.[0]; if (!f) return;
      const loc = state.scan.location, target = state.scan.targetId;
      try {
        const { blob, dataUrl } = await toJpeg(f, 1400, 0.85);
        Object.assign(state.scan, { blob, preview: dataUrl, result: null, error: '' });
        if (target) state.scan.location = state.plants.find(p => p.id === target)?.location || loc;
      } catch { state.scan.error = 'לא הצלחנו לקרוא את התמונה. נסו תמונה אחרת.'; }
      render();
    }
    const open = state.plants.find(p => p.id === state.openId);
    if (open && t.id === 'loc') putPlant({ ...open, location: t.value });
    if (open && t.id === 'every') putPlant({ ...open, waterEveryDays: Math.max(1, Math.min(60, Number(t.value) || 0)) || null });
  });
  document.addEventListener('input', e => { if (e.target.id === 'notes') state.scan.notes = e.target.value; });

  document.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    const open = state.plants.find(p => p.id === state.openId);
    if (b.dataset.loc) { state.scan.location = b.dataset.loc; render(); return; }
    if (b.dataset.open) { state.openId = b.dataset.open; state.histIdx = 0; state.renaming = false; state.confirmDelete = false; render(); scrollTo(0, 0); return; }
    if (b.dataset.hist) { state.histIdx = Number(b.dataset.hist); render(); return; }
    switch (b.id) {
      case 'go': analyze(); break;
      case 'stop': ctl?.abort(); break;
      case 'reset': state.scan = { ...freshScan(state.scan.targetId), location: state.scan.location }; render(); break;
      case 'save': saveScan(); break;
      case 'to-scan': go('scan'); break;
      case 'back': state.openId = null; state.confirmDelete = false; state.renaming = false; render(); break;
      case 'watered': putPlant({ ...open, lastWatered: new Date().toISOString() }); break;
      case 'rescan': { const id = open.id; state.view = 'scan'; state.openId = null; state.scan = { ...freshScan(id), location: open.location }; render(); scrollTo(0, 0); break; }
      case 'rename': state.renaming = true; render(); $('rename-input')?.focus(); break;
      case 'rename-save': { const v = $('rename-input').value.trim(); state.renaming = false; if (v) putPlant({ ...open, name: v.slice(0, 60) }); else render(); break; }
      case 'del': state.confirmDelete = true; render(); break;
      case 'del-no': state.confirmDelete = false; render(); break;
      case 'del-yes': state.confirmDelete = false; state.openId = null; removePlant(open.id); break;
    }
  });

  boot();
})();
</script>
